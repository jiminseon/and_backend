name: and-backend

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: prod
  DB_USERNAME: and
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  JWT_PUBLIC_KEY: file:/run/secrets/jwt/public-key.pem
  JWT_ISSUER: ${JWT_ISSUER:-and-user-service}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-and-services}
  JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
  TZ: Asia/Seoul

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: and_user
      MYSQL_USER: and
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 160m
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    networks: [backend]

  user-service:
    image: ghcr.io/jiminseon/and-backend-user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      USER_DB_URL: jdbc:mysql://mysql:3306/and_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      JWT_PRIVATE_KEY: file:/run/secrets/jwt/private-key.pem
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-1209600000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -Dfile.encoding=UTF-8
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro,Z
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 384m
    networks: [backend]

  market-data-service:
    image: ghcr.io/jiminseon/and-backend-market-data-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      MARKET_DB_URL: jdbc:mysql://mysql:3306/and_market?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -Dfile.encoding=UTF-8
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro,Z
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 384m
    networks: [backend]

  alert-service:
    image: ghcr.io/jiminseon/and-backend-alert-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      ALERT_DB_URL: jdbc:mysql://mysql:3306/and_alert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      ALERT_FCM_MODE: ${ALERT_FCM_MODE:-fake}
      FIREBASE_CONFIG_PATH: /run/secrets/firebase/firebase-admin.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -Dfile.encoding=UTF-8
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro,Z
      - ./secrets/firebase:/run/secrets/firebase:ro,Z
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      user-service:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    networks: [backend]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
