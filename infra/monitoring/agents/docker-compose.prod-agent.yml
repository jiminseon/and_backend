name: and-prod-monitoring-agent

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    ports:
      - "10.34.96.3:9100:9100"
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - label=disable
    mem_limit: 64m

  alloy:
    image: grafana/alloy:v1.16.1
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./prod-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-prod-data:/var/lib/alloy/data
    security_opt:
      - label=disable
    mem_limit: 192m

volumes:
  alloy-prod-data:

