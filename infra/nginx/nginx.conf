user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 10m;

    log_format main '$remote_addr - $request_method $request_uri $status $request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream user_service {
        server user-service:8081;
    }

    upstream alert_service {
        server alert-service:8083;
    }

    upstream market_data_service {
        server market-data-service:8082;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location = /health/user {
            proxy_pass http://user_service/actuator/health;
        }

        location = /health/alert {
            proxy_pass http://alert_service/actuator/health;
        }

        location = /health/market-data {
            proxy_pass http://market_data_service/actuator/health;
        }

        location ~ ^/api/(auth|user)(/|$) {
            proxy_pass http://user_service;
        }

        location ~ ^/api/(alerts|notifications|presets|price-check)(/|$) {
            proxy_pass http://alert_service;
        }

        location ~ ^/api/(ingest|minute-candles|daily-candles|stocks)(/|$) {
            proxy_pass http://market_data_service;
        }

        location / {
            return 404;
        }
    }
}
