spring:
  application:
    name: market-data-service
  datasource:
    url: ${MARKET_DB_URL:jdbc:mysql://localhost:3306/and_market}
    username: ${MARKET_DB_USERNAME:and}
    password: ${MARKET_DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public-key.pem}
  issuer: ${JWT_ISSUER:and-user-service}
  audience: ${JWT_AUDIENCE:and-services}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
